<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock - EcoNest</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header><h1>EcoNest</h1></header>
<nav id="nav"></nav>
<main>
  <h2>Stock</h2>
  <div id="message" role="status"></div>
  <div class="card">
    <h3>Stock in from a supplier</h3>
    <form id="stockInForm" class="form-grid">
      <label>Product <select name="productId" id="productId"></select></label>
      <label>Quantity <input name="quantity" type="number" min="1" required></label>
      <label>Supplier <input name="supplier" required></label>
      <div><button type="submit">Add to stock</button></div>
    </form>
  </div>
  <div class="card table-wrap">
    <table>
      <thead><tr><th>Product</th><th>On hand</th><th>Reorder level</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script src="../js/common.js"></script>
<script src="../js/stock.js"></script>
</body>
</html>
